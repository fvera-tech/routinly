<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./src/style.css">
  <title>fit-tracker</title>
</head>

<body>

  <main class="main">
    <section class="title">
      <h1>Routin<span>ly</span></h1>
    </section>

    <section class="graph">
      <p>SOY UN GRÁFICO</p>
    </section>

    <section class="form">
      <form>
        <legend>Ingresa tu rutina</legend>
        <fieldset class="first-selection">
          <div class="date">
            <label for="ex-date">Fecha de la rutina</label>
            <input type="date" name="ex-date" class="date-input">
          </div>
          <select id="routine">
            <option value="A">A</option>
            <option value="B">B</option>
          </select>

        </fieldset>

        <fieldset class="exercises">

          <div class="exercise">
            <h4 class="input-title">Planchas</h4>
            <div class="inputs">
              <input type="number" id="planches-ex">
              <label for="planches-ex">(seg) Acción</label>
              <input type="number" id="planches-rest">
              <label for="planches-rest"> (seg) Descanso</label>
            </div>
          </div>

          <div class="exercise">
            <h4 class="input-title">Sentadilla Goblet</h4>
            <div class="inputs">
              <div class="goblet-series">
                <input type="number" id="goblet-series">
                <label for="goblet-series">Series</label>
              </div>
              <div class="goblet-reps">
                <input type="number" id="goblet-reps">
                <label for="goblet-reps">Repeticiones</label>
              </div>
              <div class="goblet-rest">
                <input type="number" id="goblet-rest">
                <label for="goblet-rest">(seg) Descanso</label>
              </div>
            </div>
          </div>

          <div class="exercise">
            <h4 class="input-title">Flexiones</h4>
            <div class="inputs">
              <div class="pushups-series">
                <input type="number" name="pushups" id="pushups-series">
                <label for="pushups-series">Series</label>
              </div>
              <div class="pushups-reps">
                <input type="number" name="pushups" id="pushups-reps">
                <label for="pushups-reps">Repeticiones</label>
              </div>
              <div class="pushups-rest">
                <input type="number" name="pushups" id="pushups-rest">
                <label for="pushups-rest">(seg) Descanso</label>
              </div>

            </div>
          </div>

          <div class="exercise">
            <h4 class="input-title">Remo con Mancuernas</h4>
            <div class="inputs">
              <div class="dumbbell-series">
                <input type="number" name="dumbbell" id="dumbbell-series">
                <label for="dumbbell-series">Series</label>
              </div>
              <div class="dumbbell-reps">
                <input type="number" name="dumbbell" id="dumbbell-reps">
                <label for="dumbbell-reps">Repeticiones</label>
              </div>
              <div class="dumbbell-rest">
                <input type="number" name="dumbbell" id="dumbbell-rest">
                <label for="dumbbell-rest">(seg) Descanso</label>
              </div>
            </div>
          </div>

          <div class="exercise">
            <h4 class="input-title">Curl de Bíceps</h4>
            <div class="inputs">
              <div class="curl-series">
                <input type="number" name="curl" id="curl-series">
                <label for="curl-series">Series</label>
              </div>
              <div class="curl-right">
                <p class="curl-arm">Brazo Derecho</p>
                <input type="number" name="curl" id="curl-right__1">
                <input type="number" name="curl" id="curl-right__2">
                <input type="number" name="curl" id="curl-right__3">
                <input type="number" name="curl" id="curl-right__4">
              </div>
              <div class="curl-left">
                <p class="curl-arm">Brazo Izquierdo</p>
                <input type="number" name="curl" id="curl-left__1">
                <input type="number" name="curl" id="curl-left__2">
                <input type="number" name="curl" id="curl-left__3">
                <input type="number" name="curl" id="curl-left__4">
              </div>
            </div>
          </div>

          <div class="exercise">
            <h4 class="input-title">Fondos de tríceps</h4>
            <div class="inputs">
              <div class="triceps-series">
                <input type="number" name="triceps" id="triceps-series">
                <label for="triceps-series">Series</label>
              </div>
              <div class="triceps-reps">
                <input type="number" name="triceps" id="triceps-reps">
                <label for="triceps-reps">Repeticiones</label>
              </div>
              <div class="triceps-rest">
                <input type="number" name="triceps" id="triceps-rest">
                <label for="triceps-rest">(seg) Descanso</label>
              </div>
            </div>
          </div>
          <button type="button" class="submit-btn">Seleccionar</button>
        </fieldset>
      </form>
    </section>

    <section class="summary">
      <P>SOY EL RESUMEN EN TEXTO</P>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
